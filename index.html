<html lang="en"><head><meta charset="utf-8"><title>Our Museum</title>

<style>

html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}

canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
#title{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));font-size:28px;letter-spacing:.06em;color:var(--gold);pointer-events:none}
#title small{display:block;font:11px Inter,sans-serif;letter-spacing:.25em;color:#8aa0cf;text-transform:uppercase}

#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 20px));display:flex;flex-direction:column;gap:8px}
#bar .row{display:flex;gap:6px;flex-wrap:wrap}#more{position:absolute;bottom:100%;left:0;right:0;display:none;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;margin-bottom:8px;font-size:13px}#more button{padding:9px 6px;font-size:13px}#ep{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;font-size:13px}#ep button{padding:8px 6px;font-size:13px}
button,input{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid rgba(143,180,255,.5);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:15px}
button:hover{background:rgba(143,180,255,.22)}
button.gold{background:var(--gold);color:#06102a;font-weight:500}
input[type=text]{flex:1;min-width:0;background:var(--panel);border:1px solid rgba(143,180,255,.5);border-radius:10px;padding:9px 12px;outline:none}
#cust{max-height:80vh;overflow:auto;position:fixed;right:12px;top:calc(48px + env(safe-area-inset-top,0px));width:min(310px,calc(100% - 24px));padding:16px;display:none}

.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw i{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:block}
.sw i.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.sw button{padding:5px 10px;font-size:13px}.sw button.on{background:var(--gold);color:#06102a}
#lb{position:fixed;inset:0;background:rgba(5,4,6,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#lb img{max-width:92vw;max-height:70vh;border:10px solid #8fb4ff;border-image:linear-gradient(135deg,#dbe8ff,#4a7bd8,#dbe8ff) 1;box-shadow:0 20px 80px #000}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--gold);font-size:13px;display:none}
#joy{position:fixed;left:18px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;border:1px solid rgba(143,180,255,.5);background:rgba(10,8,10,.35);display:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(143,180,255,.65)}
@media (pointer:coarse){#joy{display:block}#hint{display:none}}
#hint{display:none!important;position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:11px;color:#6f82ad;text-align:right;line-height:1.6;pointer-events:none}
@media (max-width:700px){#hint{display:none}}

 <input id="arn" type="text" maxlength="20" placeholder="Her name" style="width:100%;box-sizing:border-box;margin:10px 0;background:rgba(0,0,0,.3);border:1px solid rgba(143,180,255,.5);border-radius:10px;padding:9px">
 <textarea id="arx" rows="9" style="width:100%;box-sizing:border-box;background:rgba(0,0,0,.3);color:var(--ink);border:1px solid rgba(143,180,255,.5);border-radius:10px;padding:10px;font:16px Inter,sans-serif"></textarea>

<div id="fr" style="display:none;position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);gap:8px"><button id="fw">✎ Write message</button><button class="gold" id="frv">🎆 Reveal</button></div>
<div id="cd" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;pointer-events:none;font:600 140px Georgia,serif;color:#f1d98f;text-shadow:0 4px 40px #000"></div>
<div id="sh" style="position:fixed;inset:0;background:rgba(5,4,6,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;z-index:30"><img id="shot" alt="" style="max-width:94vw;max-height:72vh;border:6px solid #8fb4ff;box-shadow:0 20px 80px #000"><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="gold" id="shs">Save / share</button><button id="shx">Close</button></div></div>

<div id="qr" class="panel" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px;text-align:center;max-width:90vw"><div class="serif" style="font-size:24px;color:var(--gold)">Invite your friend</div><div id="qrc" style="background:#fff;padding:10px;display:inline-block;margin:10px 0"></div><div id="qrl" style="font-size:11px;word-break:break-all;max-width:260px;margin:0 auto 10px;color:#8aa0cf"></div><button class="gold" id="qcp">Copy link</button> <button id="qx">Close</button></div>

 for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=(i+j)%2?"#17130f":"#e9e1d0";g.fillRect(i*128,j*128,128,128);

 g.strokeStyle="#c9a45c";g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*128,0);g.lineTo(i*128,512);g.moveTo(0,i*128);g.lineTo(512,i*128);g.stroke()}
 const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(18,11);t.anisotropy=4;return t}
/* ---------- blue gallery world ---------- */
S.background.setHex(0x040816);S.fog.color.setHex(0x040816);S.fog.near=30;S.fog.far=95;HEMI.color.setHex(0x8fb0ff);HEMI.groundColor.setHex(0x050a20);HEMI.intensity=.8;

const STRM=new T.LineBasicMaterial({vertexColors:true,color:0x3a6bff,transparent:true,opacity:.9,blending:T.AdditiveBlending,depthWrite:false}),BACKM=new T.MeshBasicMaterial({color:0x0b1f6b,side:T.BackSide}),GLOWM=new T.MeshBasicMaterial({color:0x3a7bff});
function carpetTex(){const c=document.createElement("canvas");c.width=c.height=256;const g=c.getContext("2d");g.fillStyle="#8a8f9c";g.fillRect(0,0,256,256);
 for(let i=0;i<2600;i++){const v=110+Math.random()*90|0;g.fillStyle="rgb("+v+","+v+","+(v+12)+")";g.fillRect(Math.random()*256,Math.random()*256,2,2)}
 for(let i=0;i<110;i++){g.fillStyle="rgba(255,255,255,.95)";g.fillRect(Math.random()*256,Math.random()*256,1.6,1.6)}

/* floors (main floor has a stairwell hole) */
const sh0=new T.Shape();sh0.absarc(0,0,RW,0,Math.PI*2,false);{const hl=new T.Path();hl.absarc(0,0,RW-.03,A0,A1,false);hl.absarc(0,0,20.1,A1,A0,true);hl.closePath();sh0.holes.push(hl)}
